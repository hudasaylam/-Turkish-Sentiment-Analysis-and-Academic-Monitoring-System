<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yeni Akademik Bilgi Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">📚 Öğrenci Takip Sistemi</a>
            <a href="{{ url_for('student_profile', student_id=student_id) }}" class="btn btn-light">⬅️ Geri Dön</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>📊 Yeni Akademik Bilgi Ekle</h2>
        <form method="POST">
            <div class="mb-3">
                <label>Dönem:</label>
                <select class="form-select" name="semester" required>
                    <option value="2023-2024 Güz" selected>2023-2024 Güz</option>
                    <option value="2023-2024 Bahar">2023-2024 Bahar</option>
                    <option value="2024-2025 Güz">2024-2025 Güz</option>
                    <option value="2024-2025 Bahar">2024-2025 Bahar</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Vize Ortalaması:</label>
                <input type="number" step="0.01" class="form-control" name="midterm_avg" required placeholder="Örn: 80">
            </div>
            <div class="mb-3">
                <label>Final Ortalaması:</label>
                <input type="number" step="0.01" class="form-control" name="final_avg" required placeholder="Örn: 75">
            </div>
            <div class="mb-3">
                <label>Genel Ortalama:</label>
                <input type="number" step="0.01" class="form-control" name="average_grade" required
                    placeholder="Örn: 77.5">
            </div>
            <button type="submit" class="btn btn-success">✅ Bilgiyi Ekle</button>
        </form>
    </div>

</body>

</html>
