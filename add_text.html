<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yeni Metin Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h3>📝 Yeni Metin Ekle</h3>
            <form method="POST" action="">
                <div class="mb-3">
                    <label for="text_content" class="form-label">Metin İçeriği:</label>
                    <textarea name="text_content" id="text_content" class="form-control" rows="5"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a href="{{ url_for('student_profile', student_id=student_id) }}" class="btn btn-secondary">Geri Dön</a>
            </form>
        </div>
    </div>
</body>

</html>
